name: nook

x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: runtime
  image: nook-api
  restart: unless-stopped
  environment: &api-env
    NODE_ENV: production
    PORT: "4000"
    DATABASE_URL: postgresql://nook:nook@postgres:5432/nook
    REDIS_URL: redis://redis:6379
    # Local demo default. Override in a real deployment: JWT_SECRET=... docker compose up
    JWT_SECRET: ${JWT_SECRET:-nook-local-demo-secret-change-me-0123456789}
    # Sign-ups per IP per hour; the browser test run raises it for its own stack.
    REGISTER_LIMIT_PER_HOUR: ${REGISTER_LIMIT_PER_HOUR:-20}
    # The landing page's "Try the demo" signs in as the seeded, fictional demo member. Local demo only.
    DEMO_LOGIN: ${DEMO_LOGIN:-true}
    S3_ENDPOINT: http://storage:8333
    # Presigned URLs are signed for the host the browser uses to reach storage.
    S3_PUBLIC_URL: http://localhost:8333
    S3_BUCKET: nook-uploads
    S3_ACCESS_KEY: nook
    S3_SECRET_KEY: nook-dev-secret
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
    storage: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook
      POSTGRES_DB: nook
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nook -d nook"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (SeaweedFS; MinIO no longer publishes community images).
  storage:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command: mini -dir=/data -bucket=nook-uploads -s3.config=/etc/seaweedfs/s3.json -admin.ui=false
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: nook-migrate
    environment:
      DATABASE_URL: postgresql://nook:nook@postgres:5432/nook
    depends_on:
      postgres: { condition: service_healthy }

  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-1

  api-2:
    <<: *api
    build: !reset null
    environment:
      <<: *api-env
      INSTANCE_ID: api-2

  worker:
    <<: *api
    build: !reset null
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-env
      INSTANCE_ID: worker-1
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_REPO_URL: ${NEXT_PUBLIC_REPO_URL:-}
    image: nook-web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes: [./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      api-1: { condition: service_healthy }
      api-2: { condition: service_healthy }
      web: { condition: service_started }

volumes:
  pgdata:
  s3data:
