# Single entrypoint: the web app at /, the API (REST + WebSockets) at /api and /socket.io,
# round-robined across both API replicas.

# Docker's DNS. Containers get new IPs whenever they're recreated (every redeploy), so
# upstreams re-resolve continuously instead of pinning the addresses nginx saw at startup.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream web {
  zone web 64k;
  server web:3000 resolve;
}

upstream api {
  zone api 64k;
  server api-1:4000 resolve;
  server api-2:4000 resolve;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO runs websocket-only, so no sticky sessions are needed; the Redis adapter fans out events.
  location /socket.io/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
